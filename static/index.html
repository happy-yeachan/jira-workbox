    // one streaming-execute path for both a plan run and a rollback run
    async stream(url, body, total, startMsg, mode = 'run') {
      this.resetRun();
      this.runMode = mode;
      this.progress.total = total || 0;
      this.running = true; this.status = mode === 'undo' ? '되돌리는 중' : '실행 중'; this.error = '';
      this.push('sys', '·', startMsg);
      this.controller = new AbortController();
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          signal: this.controller.signal,
        });
        if (!res.ok) {
          this.error = this.errText(await res.json().catch(() => ({})));
          this.status = '거부됨'; return;
        }
        await this.readStream(res.body.getReader());
      } catch (e) {
        if (e.name === 'AbortError') { this.status = '중단됨'; this.push('sys', '·', '사용자가 중단'); }
        else { this.error = '실행 실패: ' + e; this.status = '오류'; }
      } finally {
        this.running = false; this.controller = null;
        this.loadHistory();  // a run (or undo) changed the record
      }
    },

    fmtTime(iso) {
      try { return new Date(iso).toLocaleString(); } catch (e) { return iso; }
    },

    // Minimal SSE reader: split on blank lines, keep the `data:` payloads.
    // Heartbeat frames (`: ping`) have no data line and are ignored for free.
    async readStream(reader) {
      const decoder = new TextDecoder();
      let buffer = '';
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let cut;
        while ((cut = buffer.indexOf('\n\n')) !== -1) {
          const block = buffer.slice(0, cut);
          buffer = buffer.slice(cut + 2);
          const data = block.split('\n')
            .filter(l => l.startsWith('data:'))
            .map(l => l.slice(5).trim()).join('');
          if (data) this.onEvent(JSON.parse(data));
        }
      }
    },

    onEvent(ev) {
      if (ev.type === 'start') {
        this.progress.total = ev.total ?? this.progress.total;
        if (ev.message) this.push('sys', '·', ev.message);
      } else if (ev.type === 'phase') {
        this.phase = this.PHASES[ev.phase] || (ev.phase || '').replace(/_/g, ' ');
        if (ev.index != null) { this.progress.done = ev.index; this.progress.total = ev.total ?? 0; }
        this.push('sys', '·', `${ev.phase}${ev.message ? ': ' + ev.message : ''}`);
      } else if (ev.type === 'warning') {
        this.push('warn', '!', ev.message || '');
      } else if (ev.type === 'plan') {
        this.plan = ev.plan;
        this.status = ev.plan && ev.plan.complete === false ? '완료 (불완전)' : '완료';
        this.push('sys', '·', `결과 ${ev.total ?? 0}건`);
        this.logOpen = false;
      } else if (ev.type === 'item') {
        const it = ev.item || {};
        this.progress.done = ev.index ?? this.progress.done + 1;
        const label = this.itemLabel(it.target_id);
        this.runItems.push({ label, ok: !!it.ok, status: it.status_code ?? null, error: it.error || '' });
        if (it.ok) this.progress.ok++; else this.progress.fail++;
        // keep a raw line for the collapsible 자세히 log (label, not the internal id)
        this.push(it.ok ? 'ok' : 'bad', it.ok ? '✓' : '✕',
                  `${label} (${it.status_code ?? '-'})${it.error ? ' ' + it.error : ''}`);
      } else if (ev.type === 'batch') {
        this.push('sys', '·', ev.message || '중간 지점');
      } else if (ev.type === 'summary') {
        const s = ev.summary || {};
        this.status = s.failed ? `완료 · 실패 ${s.failed}건` : '완료';
        this.push('sys', '·', `종료: 시도 ${s.attempted} · 성공 ${s.succeeded} · 실패 ${s.failed}`);
        if (s.rollback_id && this.runMode !== 'undo') this.push('sys', '·', '작업 기록에서 되돌릴 수 있습니다 (상단 [작업 기록])');
      } else if (ev.type === 'error') {
        this.status = '오류'; this.error = ev.message || '알 수 없는 오류';
        this.push('bad', '✕', ev.message || '');
      }
    },

    PHASES: {
      resolve_target: '프로젝트 확인', list_itss: 'ITSS 조회',
      map_itss_screen_schemes: 'ITSS 매핑', list_screen_schemes: '화면 스킴 조회',
      list_screens: '화면 조회', verify_itss_projects: '프로젝트 목록 재확인',
      scan_target_workflows: '대상 워크플로우', scan_active_workflow_ids: '활성 워크플로우',
      scan_workflows: '워크플로우 전환 검사', probe_dangling: '없는 ID 확인',
      compute_verdicts: '판정 계산',
    },

    cancel() { if (this.controller) this.controller.abort(); },

    // consecutive tables with the same non-empty `group` collapse into one panel;
    // ungrouped tables each become their own always-open singleton group
    groupedTables() {
      const out = [];
      for (const t of (this.plan?.tables || [])) {
        const g = t.group || '';
        const last = out[out.length - 1];
        if (g && last && last.name === g) { last.tables.push(t); if (t.collapsed) last.collapsed = true; }
        else out.push({ id: out.length + ':' + (g || t.key), name: g, collapsed: !!t.collapsed,
                        badge: t.group_badge || '', note: t.group_note || '',
                        action: t.group_action || '', actionParams: t.group_action_params || {},
                        tables: [t] });
      }
      return out;
    },

    planSummary() {
      if (!this.plan) return '';
      if (this.plan.tables.length) {
        return this.plan.tables.reduce((n, t) => n + t.rows.length, 0) + '건';
      }
      return `변경 ${this.plan.changes.length}건 · 변경 없음 ${this.plan.skipped.length}건`;
    },

    cellClass(col) {
      if (col.kind === 'number') return 'num';
      if (col.kind === 'path') return 'path';
      if (col.kind === 'code') return 'mono';
      if (col.kind === 'tags') return 'tags';
      if (col.kind === 'badge' || col.kind === 'bool') return '';
      return 'text';
    },

    cellTitle(row, col) {
      const v = row[col.key];
      return Array.isArray(v) ? v.join('\n') : (v ?? '');
    },

    // ---- downloads: built here, in the browser. Nothing hits the server disk.
    csvCell(value) {
      let s = Array.isArray(value) ? value.join('; ')
            : (value === null || value === undefined) ? '' : String(value);
      // A leading =, +, - or @ makes a spreadsheet treat the cell as a formula.
      if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
      return '"' + s.replace(/"/g, '""') + '"';
    },

    downloadCsv(table) {
      const head = table.columns.map(c => this.csvCell(c.title || c.key)).join(',');
      const body = table.rows.map(r => table.columns.map(c => this.csvCell(r[c.key])).join(',')).join('\r\n');
      // BOM so Excel reads UTF-8 rather than mangling non-ASCII names.
      this.saveBlob('﻿' + head + '\r\n' + body, 'text/csv;charset=utf-8',
                    `${this.plan.task}-${table.key}.csv`);
    },

    downloadJson() {
      const payload = {
        task: this.plan.task, created_at: this.plan.created_at,
        complete: this.plan.complete, warnings: this.plan.warnings,
        params: this.plan.params_echo,
        tables: this.plan.tables, changes: this.plan.changes, data: this.plan.data,
      };
      this.saveBlob(JSON.stringify(payload, null, 2), 'application/json',
                    `${this.plan.task}-${this.plan.plan_id.slice(0, 8)}.json`);
    },

    saveBlob(text, type, filename) {
      const url = URL.createObjectURL(new Blob([text], { type }));
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      URL.revokeObjectURL(url);
    },

    resetRun() {
      this.progress = { done: 0, total: 0, ok: 0, fail: 0 };
      this.log = []; this.status = ''; this.phase = ''; this.logOpen = true; this.runMode = 'run';
      this.runItems = [];
    },

    // human label for a result row: the plan's Change.label when we have it
    // (emails, issue keys, scheme names…), else the raw id as a last resort.
    itemLabel(tid) {
      const c = (this.plan && this.plan.changes || []).find(x => x.target_id === tid);
      return (c && c.label) ? c.label : (tid || '항목');
    },

    push(cls, tag, text) {
      this.log.push({ cls, tag, text });
      this.$nextTick(() => { const el = this.$refs.log; if (el) el.scrollTop = el.scrollHeight; });
    },

    pct() {
      if (!this.progress.total) return 0;
      return Math.round(100 * this.progress.done / this.progress.total);
    },

    errText(data) {
      const d = data && data.detail;
      if (!d) return '요청이 거부되었습니다';
      if (typeof d === 'string') return d;
      return d.map(e => `${(e.loc || []).join('.')}: ${e.msg}`).join(' | ');
    },
  }));
});
</script>
</body>
</html>
