# dev environment. Apply with:  kubectl apply -k k8s/overlays/dev
# Reach at:  http://<node-ip>:30801
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: jira-workbox-dev

resources:
  - namespace.yaml
  - ../../base

# newest build off the develop branch
images:
  - name: jira-workbox
    newTag: develop

patches:
  - path: patch-deployment.yaml
  - path: patch-service.yaml
