# prod: structured JSON logs for ELK, and more headroom. (replicas stays 1 until
# the Redis-session capstone; then swap this for an HPA.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jira-workbox
spec:
  template:
    spec:
      containers:
        - name: jira-workbox
          env:
            - { name: WORKBOX_LOG_JSON, value: "1" }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 512Mi }
